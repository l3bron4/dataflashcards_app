<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Flashcards</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📊</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { 
        getFirestore, collection, addDoc, serverTimestamp, 
        query, where, getDocs 
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import confetti from 'https://cdn.skypack.dev/canvas-confetti';

    // --- CONFIGURATION ---
    const firebaseConfig = {
        apiKey: "AIzaSyC80dJTJ-tzpkH7FTeZgi9RksyVaiUGq9M",
        authDomain: "dataflashcards.firebaseapp.com",
        projectId: "dataflashcards",
        storageBucket: "dataflashcards.firebasestorage.app",
        messagingSenderId: "190231819778",
        appId: "1:190231819778:web:64832f57614b20f6fd591b",
        measurementId: "G-TG7RX5WLS0"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // --- GLOBALS ---
    let userPseudo = "";
    let userWeights = {}; 
    let questions = [];  
    let currentIndex = 0;
    let progressChart = null;
    let currentCategory = 'Tous';
    let cardStartTime = null;

    const rawCards = [
        { id: "q_001.1", cat: "SQL", recto: "Comment extraire l'année d'une date ?", verso: "EXTRACT(YEAR FROM ma_date) ou DATE_TRUNC(ma_date , YEAR)." },
        { id: "q_002.1", cat: "SQL", recto: "Différence entre NULL et chaîne vide '' ?", verso: "NULL est l'absence de valeur. '' est une valeur existante mais vide. NULL ne compte pas !" },
        { id: "q_003.1", cat: "SQL", recto: "Comment transformer des lignes en colonnes ?", verso: "Via un PIVOT ou des CASE WHEN agrégés." },
        { id: "q_004.1", cat: "SQL", recto: "Quel est l'ordre d'exécution réel d'une requête SQL ?", verso: "0. CTE 1. FROM/JOIN, 2. WHERE, 3. GROUP BY, 4. HAVING, 5. WINDOW, 6. SELECT, 7. DISTINCT, 8. ORDER BY, 9. LIMIT." },
        { id: "q_005.1", cat: "SQL", recto: "Comment dédoublonner avec une Window Function ?", verso: "Utilise QUALIFY ROW_NUMBER() OVER(PARTITION BY <...> ORDER BY date DESC) = 1." },
        { id: "q_006.1", cat: "SQL", recto: "À quoi sert la fonction COALESCE ?", verso: "Elle remplace la première valeur NULL rencontrée par une valeur par défaut choisie." },
        { id: "q_007.1", cat: "SQL", recto: "ROW_NUMBER() vs RANK() ?", verso: "ROW_NUMBER() donne un index unique (1,2,3). RANK() donne le même rang en cas d'égalité (1,2,2,4)." },
        { id: "q_008.1", cat: "SQL", recto: "À quoi servent LAG() et LEAD() ?", verso: "LAG accède à la ligne précédente, LEAD accède à la ligne suivante dans une partition." },
        { id: "q_161.1", cat: "Analytics Method", recto: "Comment répartir son temps pour les (4) étapes du Dashboarding ?", verso: "Cadrage (50%), SQL (20%), Dashboard (10%), Vérification (20%)." },
        { id: "q_051.1", cat: "dbt", recto: "À quoi sert la fonction {{ ref() }} ?", verso: "1. Crée les dépendances dans le DAG. 2. Gère la portabilité entre dev et prod." },
        { id: "q_181.1", cat: "Data Platform", recto: "ETL vs ELT ?", verso: "ETL: Transforme avant chargement. ELT: Charge puis transforme dans le DW (moderne/dbt)." },
        { id: "q_111.1", cat: "Business", recto: "Qu'est-ce qu'une analyse de Cohorte ?", verso: "L'étude d'un groupe d'utilisateurs ayant un point commun au fil du temps." }
        // ... (Ajoutez le reste de vos cartes ici)
    ];
    const allCards = rawCards;

    const getBrowserData = () => {
        const ua = navigator.userAgent;
        let browser = "Inconnu";
        if (ua.includes("Firefox")) browser = "Firefox";
        else if (ua.includes("Chrome")) browser = "Chrome";
        else if (ua.includes("Safari")) browser = "Safari";
        
        let device = /Mobi|Android|iPhone/i.test(ua) ? "Mobile" : "Ordinateur";
        return { browser, device };
    };

    window.startSession = async () => {
        const input = document.getElementById('pseudo-input').value;
        if (input.trim().length < 2) return alert("Veuillez entrer un pseudo valide.");
        userPseudo = input.trim();
        
        allCards.forEach(card => userWeights[card.id] = 3); 

        try {
            const q = query(collection(db, "analytics_promo"), where("pseudo", "==", userPseudo));
            const querySnapshot = await getDocs(q);
            querySnapshot.forEach((doc) => {
                const data = doc.data();
                if(data.resultat !== "skip") {
                    userWeights[data.questionId] = (data.resultat === "réussi") ? 1 : 3.1;
                }
            });
        } catch (error) {
            console.error("Erreur Firebase:", error);
        }
        
        document.getElementById('welcome-screen').classList.add('hidden');
        document.getElementById('app-content').classList.remove('hidden');
        initChart();
        filterCards('Tous'); 
    };

    window.filterCards = (category) => {
        currentCategory = category;
        currentIndex = 0;
        document.getElementById('victory-note').classList.add('hidden');
        
        document.querySelectorAll('.filter-btn').forEach(btn => {
            const btnCat = btn.getAttribute('data-cat');
            const isActive = (btnCat === category);
            btn.className = `filter-btn px-5 py-2 rounded-full text-xs font-bold transition-all ${isActive ? 'bg-indigo-600 text-white shadow-md' : 'bg-white text-slate-400 border border-slate-100 hover:bg-slate-50'}`;
        });

        let baseCards = category === 'Tous' ? [...allCards] : allCards.filter(c => c.cat === category);
        let weightedPool = [];
        baseCards.forEach(card => {
            const w = userWeights[card.id] || 3;
            const loop = Math.ceil(w); 
            for (let i = 0; i < loop; i++) weightedPool.push(card);
        });
        questions = shuffleArray([...new Set(weightedPool)]);
        updateUI();
    };

    window.markAs = async (known) => {
        if (questions.length === 0) return;
        const card = questions[currentIndex];
        const isFlipped = document.getElementById('flashcard').classList.contains('card-flipped');
        
        userWeights[card.id] = known ? 1 : 3.1;

        try {
            await addDoc(collection(db, "analytics_promo"), {
                pseudo: userPseudo,
                questionId: card.id,
                resultat: known ? "réussi" : "à revoir",
                date: serverTimestamp()
            });
        } catch (e) { console.error(e); }

        const scope = currentCategory === 'Tous' ? allCards : allCards.filter(c => c.cat === currentCategory);
        const categoryMastered = scope.every(c => userWeights[c.id] === 1);
        
        if (categoryMastered) {
            confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
            document.getElementById('victory-note').classList.remove('hidden');
        }
        
        setTimeout(nextCard, 300);
    };

    window.nextCard = () => { currentIndex = (currentIndex + 1) % questions.length; updateUI(); };
    window.prevCard = () => { currentIndex = (currentIndex - 1 + questions.length) % questions.length; updateUI(); };
    window.flipCard = () => document.getElementById('flashcard').classList.toggle('card-flipped');
    window.skipCard = () => nextCard();

    function updateUI() {
        if (questions.length === 0) return;
        const card = questions[currentIndex];
        document.getElementById('card-category').innerText = card.cat;
        document.getElementById('card-recto').innerText = card.recto;
        document.getElementById('card-verso').innerText = card.verso;
        document.getElementById('card-counter').innerText = `${currentIndex + 1} / ${questions.length}`;
        document.getElementById('flashcard').classList.remove('card-flipped');

        const weight = userWeights[card.id];
        const badge = document.getElementById('card-status');
        if (weight === 1) {
            badge.innerText = "● MAÎTRISÉ";
            badge.className = "text-[10px] font-black text-teal-500 tracking-[0.2em] mb-4 block";
        } else if (weight === 3.1) {
            badge.innerText = "● À REVOIR";
            badge.className = "text-[10px] font-black text-pink-500 tracking-[0.2em] mb-4 block";
        } else {
            badge.innerText = "● NOUVEAU";
            badge.className = "text-[10px] font-black text-indigo-400 tracking-[0.2em] mb-4 block";
        }
    }

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function initChart() {
        const ctx = document.getElementById('progressChart').getContext('2d');
        if (progressChart) progressChart.destroy();
        progressChart = new Chart(ctx, {
            type: 'doughnut',
            data: { datasets: [{ data: [0, 0, 100], backgroundColor: ['#14b8a6', '#ec4899', '#f1f5f9'], borderWidth: 0 }] },
            options: { cutout: '80%', plugins: { legend: { display: false } } }
        });
    }

    document.addEventListener('keydown', (e) => {
        if(document.getElementById('welcome-screen').classList.contains('hidden')) {
            if(e.code === 'Space') { e.preventDefault(); flipCard(); }
            if(e.code === 'Enter') markAs(true);
            if(e.code === 'Escape') markAs(false);
        }
    });
</script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .perspective { perspective: 1500px; }
        .card-inner { position: relative; width: 100%; height: 100%; transition: transform 0.6s; transform-style: preserve-3d; cursor: pointer; }
        .card-flipped { transform: rotateY(180deg); }
        .card-front, .card-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; align-items: center; justify-content: center; padding: 2rem; border-radius: 2rem; }
        .card-back { transform: rotateY(180deg); }
        .kbd-key { background: rgba(0,0,0,0.05); padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; border: 1px solid rgba(0,0,0,0.1); }
    </style>
</head>

<body class="bg-slate-50 text-slate-900 min-h-screen flex items-center justify-center">

    <div id="welcome-screen" class="bg-white p-10 rounded-[3rem] shadow-xl text-center max-w-md w-full mx-4 border border-slate-100">
        <h1 class="text-3xl font-black text-indigo-600 mb-2">Data Flashcards</h1>
        <p class="text-slate-400 mb-8">Entrez votre pseudo pour commencer.</p>
        <input id="pseudo-input" type="text" placeholder="Pseudo" class="w-full p-4 border-2 border-slate-100 rounded-2xl mb-6 text-center text-lg font-bold outline-none focus:border-indigo-500">
        <button onclick="startSession()" class="w-full bg-indigo-600 text-white p-4 rounded-2xl font-bold text-xl hover:bg-indigo-700 transition-all">C'est parti !</button>
    </div>

    <div id="app-content" class="hidden w-full max-w-5xl mx-auto px-4">
        <header class="flex flex-col md:flex-row justify-between items-center mb-10 gap-6">
            <div class="bg-white p-6 rounded-[2rem] shadow-sm border border-slate-100 flex-1">
                <h1 class="text-2xl font-black text-indigo-600">Dashboard de Révision</h1>
                <div class="flex flex-wrap gap-2 mt-4">
                    <button onclick="filterCards('Tous')" data-cat="Tous" class="filter-btn px-4 py-2 rounded-full text-xs font-bold">Tous</button>
                    <button onclick="filterCards('SQL')" data-cat="SQL" class="filter-btn px-4 py-2 rounded-full text-xs font-bold">SQL</button>
                    <button onclick="filterCards('dbt')" data-cat="dbt" class="filter-btn px-4 py-2 rounded-full text-xs font-bold">dbt</button>
                </div>
            </div>
            <div class="h-24 w-24 relative bg-white p-2 rounded-full shadow-sm">
                <canvas id="progressChart"></canvas>
            </div>
        </header>

        <main class="flex flex-col items-center space-y-8">
            <div id="victory-note" class="hidden bg-teal-100 text-teal-700 px-6 py-2 rounded-full font-bold animate-bounce">🏆 Section maîtrisée !</div>
            
            <div class="perspective w-full max-w-2xl h-[350px]">
                <div id="flashcard" class="card-inner" onclick="flipCard()">
                    <div class="card-front bg-white border border-slate-100 shadow-sm">
                        <div class="text-center">
                            <span id="card-status"></span>
                            <span id="card-category" class="text-[10px] font-black text-indigo-300 uppercase tracking-widest block mb-4"></span>
                            <h2 id="card-recto" class="text-xl md:text-2xl font-extrabold text-slate-800"></h2>
                        </div>
                    </div>
                    <div class="card-back bg-indigo-600 text-white shadow-xl">
                        <div id="card-verso" class="text-center text-lg font-medium px-6"></div>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-3 gap-4 w-full max-w-2xl">
                <button onclick="markAs(false)" class="bg-white p-6 rounded-3xl font-bold text-slate-400 hover:text-pink-500 border border-slate-100 transition-all">✖ À revoir</button>
                <button onclick="skipCard()" class="bg-slate-100 p-6 rounded-3xl font-bold text-slate-400 hover:text-slate-600 transition-all">⏭ Skip</button>
                <button onclick="markAs(true)" class="bg-teal-500 p-6 rounded-3xl font-bold text-white shadow-lg hover:bg-teal-600 transition-all">✔ Maîtrisé</button>
            </div>
            
            <div class="flex justify-between w-full max-w-2xl text-slate-400 text-sm font-bold">
                <button onclick="prevCard()">← Retour</button>
                <span id="card-counter" class="bg-slate-100 px-4 py-1 rounded-full"></span>
                <button onclick="nextCard()">Suivant →</button>
            </div>
        </main>
    </div>
</body>
</html>
